name: build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

    - name: Checkout Aseprite
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")

        skia_url=$(source "$this_dir/laf/misc/skia-url.sh" | xargs)
        skia_file=$(basename "$skia_url")

        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - name: Install Ninja
      uses: aseprite/get-ninja@main

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=on \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64)

    - name: Compile
      shell: bash
      run: |
        cd build
        ninja

    - name: Copy OpenSSL DLLs
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $crypto = Get-ChildItem -Path "C:\" -Filter "libcrypto-3-x64.dll" -Recurse -ErrorAction SilentlyContinue |
          Select-Object -First 1

        $ssl = Get-ChildItem -Path "C:\" -Filter "libssl-3-x64.dll" -Recurse -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if ($null -eq $crypto) {
          Write-Error "libcrypto-3-x64.dll was not found on the runner."
          exit 1
        }

        if ($null -eq $ssl) {
          Write-Error "libssl-3-x64.dll was not found on the runner."
          exit 1
        }

        Copy-Item $crypto.FullName "build/bin/libcrypto-3-x64.dll"
        Copy-Item $ssl.FullName "build/bin/libssl-3-x64.dll"

        Write-Host "Copied:"
        Write-Host $crypto.FullName
        Write-Host $ssl.FullName

    - name: Run C++ Tests
      shell: bash
      run: |
        cd build
        ctest --output-on-failure

    - name: Run CLI Tests
      shell: bash
      run: |
        export ASEPRITE=$PWD/build/bin/aseprite
        cd tests
        bash run-tests.sh

    - name: Package Aseprite
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path package | Out-Null

        Copy-Item "build/bin/aseprite.exe" "package/aseprite.exe"
        Copy-Item "build/bin/data" "package/data" -Recurse -Force

        if (Test-Path "build/bin/zlib.dll") {
            Copy-Item "build/bin/zlib.dll" "package/zlib.dll"
        }

        Write-Host ""
        Write-Host "===== Aseprite package ====="
        Get-ChildItem "package" -Recurse
        Write-Host "============================"

    - name: Upload Windows Aseprite
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-windows
        path: package/
        if-no-files-found: error
